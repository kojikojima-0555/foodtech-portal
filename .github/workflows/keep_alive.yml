name: Keep Streamlit App Alive (Power Up)

on:
  schedule:
    # 💡 対策：混雑する0分を避け、中途半端な「23分」に設定
    # 💡 対策：6時間おき（1日4回：日本時間の 8:23, 14:23, 20:23, 2:23）に激しくノックします
    - cron: '23 */6 * * *'
  workflow_dispatch: # 手動で起こすボタンも残します

jobs:
  ping_app:
    runs-on: ubuntu-latest
    steps:
      - name: Wake up Streamlit App
        run: |
          # 💡 対策：ブラウザ（Chrome）のふりをして、ページ丸ごとをしっかりダウンロードして叩き起こします
          curl -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
          -s -o /dev/null -w "HTTP Status: %{http_code}\n" \
          "https://foodtech-appgit-msgjve5ruytzjpnwuqiv9a.streamlit.app/#google-scholar"
