name: Keep Streamlit App Alive (Auto Commit Version)

on:
  schedule:
    # 💡 3時間おき（1日8回）に、自動で小さな更新をGitHubにプッシュします
    # 世界中の混雑を避けるため、中途半端な「43分」に設定しています
    - cron: '43 */3 * * *'
  workflow_dispatch: # Actionsタブから手動でボタンを押して実行することも可能

permissions:
  contents: write # 💡 ロボットが自分のGitHubに自動で書き込み（プッシュ）する権限を与えます

jobs:
  auto_commit:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 最新のコードを読み込み
        uses: actions/checkout@v4

      - name: 2. ダミーファイルに現在の時刻を書き込み
        run: |
          mkdir -p .github/keep_alive
          date +"%Y-%m-%d %H:%M:%S" > .github/keep_alive/ping.txt

      - name: 3. GitHubへ自動でコミット＆プッシュを実行
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .github/keep_alive/ping.txt
          # 変更がある場合のみ実行（エラー防止）
          git diff --cached --quiet || (git commit -m "Keep alive ping" && git push)
